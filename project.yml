name: WhyNode
options:
  bundleIdPrefix: com.pargame
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  WhyNodeCore:
    path: Packages/WhyNodeCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  WhyNode:
    type: application
    supportedDestinations: [macOS]
    sources:
      - path: App
    dependencies:
      - package: WhyNodeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pargame.whynode
        PRODUCT_NAME: WhyNode
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
      configs:
        # 임시 서명(-)에서는 Xcode가 Hardened Runtime을 서명에 넣지 않으므로 배포용 빌드에만 직접 넣는다.
        # 개발용 빌드는 미리보기 라이브러리가 서명 검사에 걸리지 않도록 그대로 둔다.
        Release:
          OTHER_CODE_SIGN_FLAGS: "--options=runtime"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: WhyNode
        LSApplicationCategoryType: public.app-category.education
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: WhyNode Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.pargame.whynode]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.pargame.whynode
            UTTypeDescription: WhyNode Document
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [whynode]
